spring:
  application:
    name: securedoc-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/securedoc_db
    username: securedoc_user
    password: securedoc_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    com.securedoc: DEBUG
    org.springframework.security: DEBUG

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000