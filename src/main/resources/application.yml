spring:
  application:
    name: securedoc-ai
  datasource:
    url:  jdbc:postgresql://localhost:5432/securedoc_db
    username: securedoc_user
    password: securedoc_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8080
logging:
  level:
    com.securedoc: DEBUG
    org.springframework.security: DEBUG

